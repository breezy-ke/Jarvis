  # --- Reply-To and name spoofing ----------------------------------------------------------------
  - id: reply-to-hijack
    technique: reply_to_hijack
    from: "Achieng <achieng@client.co.ke>"
    reply_to: attacker@evil.test
    subject: Signed contract
    body: Please reply with the signed contract and your bank details.
    ask: reply with the contract and bank details
